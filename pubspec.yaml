name: sunsafe_checkin
description: SunSafe Check-In — dual-mode senior check-in app for parents and caregivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.5
  firebase_storage: ^12.4.5

  # Payments
  purchases_flutter: ^8.6.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # AI / networking
  http: ^1.3.0
  http_parser: ^4.1.2

  # Background & sensors
  workmanager: ^0.5.2
  battery_plus: ^6.2.1
  sensors_plus: ^6.1.1

  # Offline cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Auth extras
  sign_in_with_apple: ^6.1.4

  # Audio recording & playback
  record: ^5.2.1
  audioplayers: ^6.4.0
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
